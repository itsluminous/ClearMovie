# Robolectric runs every test with a plain Application instead of the manifest's
# @HiltAndroidApp class, so no test needs a Hilt test component. Tests that
# exercise screens use the stateless composables directly.
application=android.app.Application
# Robolectric needs Java 21 to emulate SDK 35 and newer; CI and the build use
# JDK 17 (as ClearSMS does), so JVM tests emulate SDK 34. API 29 and 36 are
# covered for real by the instrumented tests.
sdk=34
