name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege: every job only reads the repository, except two that run
# only on v* tags: `publish` needs `contents: write` to create the GitHub
# Release, and `redeploy-site` needs `actions: write` to start the website
# deploy.
permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Verifies gradle-wrapper.jar against the official checksums so a
      # tampered wrapper never runs in CI (the other jobs need this one).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ktlint; Android Lint (HardcodedText, MissingTranslation and
      # ExtraTranslation are errors, app/lint.xml); unit tests, including the
      # convention tests (no literal UI text in Compose, string key parity);
      # and the project model's line-coverage bound (90%, Kover).
      - name: ktlint, Android Lint, unit tests, model coverage
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest koverVerifyDebug

      - name: Upload test & lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    needs: check
    runs-on: ubuntu-latest
    # About 50 minutes on API 29's software-rendered emulator; a slow runner went past an hour.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # 29 is minSdk (Android 10, AppCompat stores the language choice);
        # 36 is targetSdk (LocaleManager stores it).
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator is created on the runner and thrown away with it.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: ./gradlew connectedDebugAndroidTest

      # Kept on success too: the reports and per-test logcat are the proof of
      # what each API level measured (the colour calibration logs its result).
      - name: Upload instrumented test reports
        if: always()
        # A failed upload must not turn a passing run (or a release) red.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  release:
    name: Build release APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # True only on a v* tag with all four signing secrets: pushes to main and
      # pull requests build (and verify) an unsigned APK, so no signed build of an
      # unreleased commit ever leaves CI and PR code never runs with the key.
      HAS_SIGNING_SECRETS: >-
        ${{
          startsWith(github.ref, 'refs/tags/v') &&
          secrets.SIGNING_KEYSTORE_BASE64 != '' &&
          secrets.SIGNING_KEYSTORE_PASSWORD != '' &&
          secrets.SIGNING_KEY_ALIAS != '' &&
          secrets.SIGNING_KEY_PASSWORD != ''
        }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Refuse to publish an unsigned release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING_SECRETS != 'true'
        run: |
          echo "::error::A v* tag needs the four SIGNING_* secrets (docs/release-signing.md); refusing to publish an unsigned APK."
          exit 1

      # The secret reaches the shell only through an environment variable,
      # never by interpolation into the script text.
      - name: Decode release keystore
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"

      - name: Assemble release APK
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ env.HAS_SIGNING_SECRETS == 'true' && secrets.SIGNING_KEYSTORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ env.HAS_SIGNING_SECRETS == 'true' && secrets.SIGNING_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ env.HAS_SIGNING_SECRETS == 'true' && secrets.SIGNING_KEY_PASSWORD || '' }}
        run: |
          if [ "$HAS_SIGNING_SECRETS" = "true" ]; then
            export SIGNING_KEYSTORE_FILE="$RUNNER_TEMP/keystore.jks"
          fi
          ./gradlew assembleRelease

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      # Exactly one APK, ClearMovie-<versionName>.apk; native libraries for all
      # four ABIs; versionCode base*10 and above 0.0.1's per-ABI codes; and,
      # when signed, a v2 and v3 signature (scripts/verify-release-apks.sh).
      - name: Verify release APK (name, native libraries, versionCode, signatures)
        env:
          VERIFY_SIGNATURES: ${{ env.HAS_SIGNING_SECRETS }}
        run: scripts/verify-release-apks.sh app/build/outputs/apk/release

      # A v0.0.2 tag must not publish an APK built as 0.0.1. The verify step
      # above has already checked there is exactly one APK and that its name
      # carries the versionName inside it.
      - name: Check the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/ClearMovie-*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ClearMovie-<version>.apk, found ${#apks[@]}."
            exit 1
          fi
          version="$(basename "${apks[0]}" | sed -E 's/^ClearMovie-(.+)\.apk$/\1/')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match versionName $version in app/build.gradle.kts."
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clearmovie-release
          path: app/build/outputs/apk/release/ClearMovie-*.apk
          if-no-files-found: error

  # Publishes only on a v* tag, and only after the release APK verified AND
  # the instrumented tests passed on both API levels.
  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, instrumented]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: clearmovie-release
          path: apks

      # The release body is the tag's full release notes, docs/release-notes/<tag>.md,
      # when that file exists; otherwise the short user-facing changelog for the
      # base versionCode. A missing file cannot break the release: a short
      # stand-in is used and GitHub's generated commit list is appended either way.
      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          code=$(sed -nE 's/^val baseVersionCode *= *([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)
          full="docs/release-notes/${TAG}.md"
          notes="fastlane/metadata/android/en-US/changelogs/${code}.txt"
          if [ -s "$full" ]; then
            cp "$full" release-notes.md
          elif [ -s "$notes" ]; then
            cp "$notes" release-notes.md
          else
            echo "See the commit list below for what changed." > release-notes.md
          fi
          echo "--- release notes ---"; cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: apks/ClearMovie-*.apk
          fail_on_unmatched_files: true
          body_path: release-notes.md
          generate_release_notes: true

  # Redeploys the website so its Download buttons point at the APK just
  # published. A release created with GITHUB_TOKEN starts no other workflow's
  # `release` event, but a workflow_dispatch does. Its own job, so the
  # third-party release action above never holds `actions: write`.
  redeploy-site:
    name: Redeploy website
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # The REST call needs only `actions: write` (the job has nothing else).
      - name: Start the Deploy website workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
